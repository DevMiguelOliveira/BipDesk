services:
  # Servidor de Sinalização e Registro de IDs (BipDesk HBBS)
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: bipdesk-hbbs
    restart: unless-stopped
    networks:
      - bipdesk-net
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    command: hbbs -r ${DOMAIN:-localhost}:21117 -k _
    volumes:
      - bipdesk-server-data:/root
    environment:
      - ALWAYS_USE_RELAY=N
    deploy:
      resources:
        limits:
          memory: 120M
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21116 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Servidor de Relay para tráfego criptografado (BipDesk HBBR)
  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: bipdesk-hbbr
    restart: unless-stopped
    networks:
      - bipdesk-net
    ports:
      - "21117:21117"
    command: hbbr -k _
    volumes:
      - bipdesk-server-data:/root
    deploy:
      resources:
        limits:
          memory: 120M

  # API de Gerenciamento, Inventário e Heartbeat (FastAPI + SQLite WAL)
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: bipdesk-api:1.0.0
    container_name: bipdesk-api
    restart: unless-stopped
    networks:
      - bipdesk-net
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - bipdesk-api-data:/data
      - bipdesk-secrets-data:/data/secrets
      - bipdesk-server-data:/server-keys:ro
      - ./downloads:/downloads:ro
    environment:
      - DATABASE_URL=sqlite:////data/bipdesk.db
      - SERVER_PUBKEY_PATH=/server-keys/id_ed25519.pub
      - PORT=8080
      - HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Proxy Reverso Caddy com HTTPS e Rate Limiting de Borda
  caddy:
    image: caddy:2-alpine
    container_name: bipdesk-caddy
    restart: unless-stopped
    networks:
      - bipdesk-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bipdesk-caddy-data:/data
      - bipdesk-caddy-config:/config
      - ./downloads:/var/www/downloads:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  bipdesk-net:
    name: bipdesk-net
    driver: bridge

volumes:
  bipdesk-server-data:
  bipdesk-api-data:
  bipdesk-secrets-data:
  bipdesk-caddy-data:
  bipdesk-caddy-config:
