name: Build BipDesk Admin (Tech App)

on:
  push:
    paths:
      - 'tech-app/**'
      - '.github/workflows/build-tech-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@3951f328a4a583e74ca67c4730703a1824199a1e # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore tech-app/BipDesk.Tech.csproj

      - name: Build and Publish Single-File Executable
        run: dotnet publish tech-app/BipDesk.Tech.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist/admin

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ./dist/admin/BipDesk_Admin.exe).Hash
          "$hash  BipDesk_Admin.exe" | Out-File -FilePath ./dist/admin/BipDesk_Admin.exe.sha256 -Encoding ascii
          Write-Host "BipDesk_Admin.exe SHA-256: $hash"

      - name: Package Admin Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./dist/bundle" | Out-Null
          Copy-Item ./dist/admin/* ./dist/bundle/ -Recurse -Force
          Compress-Archive -Path ./dist/bundle/* -DestinationPath ./dist/BipDesk_Admin_Completo.zip -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 ./dist/BipDesk_Admin_Completo.zip).Hash
          "$zipHash  BipDesk_Admin_Completo.zip" | Out-File -FilePath ./dist/BipDesk_Admin_Completo.zip.sha256 -Encoding ascii

      - name: Upload Standalone Admin Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: BipDesk_Admin_Windows_x64
          path: |
            ./dist/admin/BipDesk_Admin.exe
            ./dist/admin/BipDesk_Admin.exe.sha256

      - name: Upload Full Bundle Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: BipDesk_Admin_Completo_Zip
          path: |
            ./dist/BipDesk_Admin_Completo.zip
            ./dist/BipDesk_Admin_Completo.zip.sha256
