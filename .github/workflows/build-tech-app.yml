name: Build BipDesk Admin (Tech App)

on:
  push:
    paths:
      - 'tech-app/**'
      - '.github/workflows/build-tech-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore tech-app/BipDesk.Tech.csproj

      - name: Build and Publish Single-File Executable
        run: |
          dotnet publish tech-app/BipDesk.Tech.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./dist/admin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BipDesk_Admin_Windows_x64
          path: ./dist/admin/BipDesk_Tech.exe
