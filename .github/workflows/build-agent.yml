name: Build BipDesk Host Agent

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go 1.24
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.24'
          cache: false

      - name: Run Tests
        working-directory: ./agent
        run: |
          go test -v ./...

      - name: Build Windows Binary
        working-directory: ./agent
        run: |
          go mod tidy
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go install github.com/tc-hib/go-winres@latest
          & "$((go env GOPATH))\bin\go-winres.exe" make
          New-Item -ItemType Directory -Force -Path ../dist/agent | Out-Null
          go build -ldflags "-s -w -H=windowsgui" -o ../dist/agent/bipdesk-agent.exe main.go

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ./dist/agent/bipdesk-agent.exe).Hash
          "$hash  bipdesk-agent.exe" | Out-File -FilePath ./dist/agent/bipdesk-agent.exe.sha256 -Encoding ascii
          Write-Host "Generated SHA-256: $hash"

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: BipDesk_Host_Agent_Windows_x64
          path: |
            ./dist/agent/bipdesk-agent.exe
            ./dist/agent/bipdesk-agent.exe.sha256
