name: Build BipDesk Session (RustDesk 1.4.9 Fork)

on:
  workflow_dispatch:

jobs:
  build-session:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Upstream Engine 1.4.9
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.exe" -OutFile "rustdesk-raw.exe"
          mkdir -p dist/session

      - name: Install Resource Hacker CLI
        shell: pwsh
        run: choco install -y resourcehacker

      - name: Embed Custom BipDesk Icon and Branding
        shell: pwsh
        run: |
          $iconPath = (Resolve-Path "client/resources/icon.ico").Path
          Write-Host "Injetando ícone oficial do BipDesk: $iconPath"
          
          # Injeta o ícone nas tabelas de recursos do executável
          & "C:\Program Files (x86)\Resource Hacker\ResourceHacker.exe" -open rustdesk-raw.exe -save dist/session/BipDesk_Session.exe -action addoverwrite -res $iconPath -mask ICONGROUP,MAINICON,
          
          if (-not (Test-Path "dist/session/BipDesk_Session.exe")) {
            Copy-Item "rustdesk-raw.exe" "dist/session/BipDesk_Session.exe"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BipDesk_Session_Windows_x64
          path: ./dist/session/BipDesk_Session.exe
